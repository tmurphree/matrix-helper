name: Run Node command
on:
    workflow_call:
        inputs:
            command:
                description: Shell command to run after npm ci
                required: true
                type: string
jobs:
    run:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js from .nvmrc
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: npm ci
            - run: ${{ inputs.command }}
