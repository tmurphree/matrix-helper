name: Node.js CI
on:
    pull_request:
        branches: [ "main" ]
permissions:
    contents: read
jobs:
    unit-tests:
        uses: ./.github/workflows/run-node-command.yml
        with:
            command: npm run build && npm run test:coverage
    linting:
        uses: ./.github/workflows/run-node-command.yml
        with:
            command: npm run check
